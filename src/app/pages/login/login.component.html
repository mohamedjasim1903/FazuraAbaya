<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome <em>Back</em></h1>
      <p>Sign in to your Fazura account</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" style="font-size: 11px; color: var(--gold, #d4af37); text-decoration: none;">Forgot Password?</a>
        </div>
        <input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
      </div>

      <div class="form-error" *ngIf="error">{{ error }}</div>

      <button type="submit" class="auth-btn" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
